[project]
name = "glitchtip-backend"
version = "0.1.0"
description = "Django backend that powers GlitchTip, an open source reimplementation of Sentry"
authors = ["David Burke"]
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "django~=6.0",
    "django-vtasks[valkey]~=2.1.2",
    "django-allauth[mfa,socialaccount]~=65.0",
    "django-cors-headers~=4.0",
    "django-environ~=0.11",
    "django-extensions~=4.0",
    "django-organizations~=2.3",
    "django-storages[boto3,azure,google]~=1.12",
    "uWSGI~=2.0",
    "whitenoise~=6.0",
    "sentry-sdk~=2.20",
    "cxxfilt~=0.3.0",
    "django-anymail~=15.0",
    "user-agents~=2.1",
    "django-ipware~=7.0",
    "anonymizeip~=1.0",
    "symbolic~=13.1.1",
    "aiohttp~=3.7",
    "google-cloud-logging~=3.0",
    "django-prometheus~=2.2",
    "uwsgi-chunked~=0.1",
    "django-import-export~=4.1",
    "psycopg[c,pool]~=3.1",
    "django-ninja~=1.5",
    "boto3~=1.34",
    "orjson~=3.9",
    "pydantic[email]~=2.11",
    "django-ninja-cursor-pagination>=0.1.0",
    "django-postgres-partition>=0.1.4",
    "pyyaml>=6.0.2", # allauth openapi spec
    "granian[reload,uvloop]>=2.6.0",
    "django-vcache>=2.2.0",
    "glitchtip-rust>=0.2.1",
    "uuid6>=2024.1.12",
    "mcp[cli]>=1.9",
    "duckdb>=1.2.0",
    "minidump>=0.0.24",
    "arro3-core~=0.8",
    "arro3-io~=0.8",
    "django-async-backend~=6.0",
    "opentelemetry-proto~=1.0",
]

[dependency-groups]
dev = [
    "locust~=2.10",
    "freezegun~=1.1",
    "model_bakery~=1.1",
    "django-debug-toolbar~=6.0",
    "django-stubs[compatible-mypy]~=6.0",
    "django-sslserver~=0.22",
    "aioresponses~=0.7",
    "memray~=1.9",
    "ruff~=0.6",
    "tblib~=3.0",                         # Needed for test --parallel
    "ipython>=8.32.0",
    "vulture>=2.14",
    "coverage>=7.13.4",
]

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.lint.per-file-ignores]
"*/migrations/*.py" = ["I"]

[tool.mypy]
plugins = ["mypy_django_plugin.main"]

[tool.django-stubs]
django_settings_module = "glitchtip.settings"

[tool.pyright]
venvPath = "."
venv = ".venv"
