[project]
name = "glitchtip-backend"
version = "0.1.0"
description = "Django backend that powers GlitchTip, an open source reimplementation of Sentry"
authors = ["David Burke"]
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "django>=6.1,<6.2",
    "django-vtasks[valkey]~=3.2.0",
    "django-allauth-async[mfa,socialaccount]==65.19.1.1",
    "django-cors-headers~=4.0",
    "django-environ~=0.11",
    "django-extensions~=4.0",
    "django-organizations~=2.7",
    "django-storages[boto3,azure,google]~=1.12",
    "sentry-sdk~=2.20",
    "django-anymail~=15.0",
    "user-agents~=2.1",
    "django-ipware~=8.0",
    "anonymizeip~=1.0",
    "aiohttp~=3.14",
    "google-cloud-logging~=3.0",
    # Resolves to 2.4.0, not the newer 2.5.0: that release caps Django below
    # 6.1. 2.4.0 declares no Django constraint at all, so it will not fail
    # loudly on a future Django bump — re-check it whenever Django moves.
    "django-prometheus~=2.2",
    "django-import-export~=4.1",
    # Library-only: psycopg.sql composition and Jsonb/Json parameter
    # wrappers, plus the import Django's stock postgresql backend performs.
    # No database I/O flows through psycopg
    "psycopg~=3.1",
    "django-ninja~=1.6",
    "boto3~=1.34",
    "orjson~=3.9",
    "pydantic[email]~=2.11",
    "django-ninja-cursor-pagination>=0.1.0",
    "django-postgres-partition>=0.1.4",
    "pyyaml>=6.0.2", # allauth openapi spec
    "granian[reload,uvloop]>=2.6.0",
    "servestatic[brotli]>=4.3",
    "django-vcache>=3.2.0",
    "glitchtip-rust>=0.10.0",
    "uuid6>=2024.1.12",
    # Bounded below 3: the SDK moves its server API across majors (v2 renamed
    # FastMCP to MCPServer), so a major bump is a code change, not a relock.
    "mcp[cli]>=2.1.1,<3",
    "duckdb>=1.2.0",
    "minidump>=0.0.24",
    "arro3-core~=0.8",
    "arro3-io~=0.8",
    # Matches Django major/minor
    "django-async-backend>=6.1,<6.2",
    "opentelemetry-proto~=1.0",
]

[dependency-groups]
# CI's lint job installs only this group, so the linters it runs are the ones
# pinned in uv.lock — there is no second version to keep in sync by hand.
# ruff is pinned to a patch range on purpose: pre-1.0 it changes its *default*
# rule selection across minor versions, so `~=0.16` would let a routine
# `uv lock --upgrade` drop hundreds of new findings into an unrelated
# dependency MR. Widening this is a deliberate edit plus a tree sweep.
lint = [
    "ruff~=0.16.0",
    "vulture~=2.16",
]
dev = [
    {include-group = "lint"},
    "freezegun~=1.1",
    "model-bakery-async~=1.23",
    "django-debug-toolbar~=8.0",
    "django-stubs[compatible-mypy]~=6.0",
    "django-sslserver~=0.22",
    # The benchmark harness's HTTP client. Declared rather than relied on
    # transitively (it reaches us via the MCP SDK) so a future SDK change
    # cannot silently take it away, as the move off httpx already did once.
    "httpx2~=2.12",
    "memray~=1.9",
    "tblib~=3.0",                         # Needed for test --parallel
    "ipython>=8.32.0",
    "coverage>=7.13.4",
]

[tool.ruff.lint]
extend-select = ["I"]
ignore = [
    # Django's declarative style is built on mutable class attributes
    # (`Meta.ordering`, `fields`, `list_display`, serializer/schema config).
    # Annotating every one with `ClassVar` adds noise without catching bugs.
    "RUF012",
    # Ingest, alert delivery and maintenance tasks deliberately swallow broad
    # exceptions so one bad payload or one unreachable endpoint cannot take
    # down a batch. Each site is a considered choice, not an oversight.
    "BLE001",
    "S110",
    # Naive datetimes are used on purpose for date-bucket keys, partition
    # boundaries and test fixtures. Django's `USE_TZ` handling covers the
    # stored values; blanket-flagging every `datetime(...)` is noise.
    "DTZ001",
    "DTZ005",
    "DTZ007",
    # Long-lived file handles (cold storage writers, streaming uploads) are
    # closed explicitly rather than scoped to a `with` block.
    "SIM115",
    # File-mode rules depend on the checkout's permission bits, which git does
    # not track for these files; they fire differently per developer machine.
    "EXE001",
    "EXE002",
]

[tool.ruff.lint.per-file-ignores]
"*/migrations/*.py" = ["I"]
# The module name is the management command name (`manage.py import`), so it
# cannot avoid shadowing the keyword.
"apps/importer/management/commands/import.py" = ["N999"]

[tool.ruff.lint.flake8-bugbear]
# django-ninja declares request parsing in argument defaults; that is the
# framework's API, not an accidental shared mutable default.
extend-immutable-calls = ["ninja.File", "ninja.Form", "ninja.Query"]

[tool.mypy]
plugins = ["mypy_django_plugin.main"]

[tool.django-stubs]
django_settings_module = "glitchtip.settings"

[tool.pyright]
venvPath = "."
venv = ".venv"
