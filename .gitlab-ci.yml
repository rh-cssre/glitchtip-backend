variables:
  PROJECT_NAME: glitchtip
  PIP_DISABLE_PIP_VERSION_CHECK: "on"
  POSTGRES_HOST_AUTH_METHOD: "trust"
  UV_VERSION: 0.9
  BASE_LAYER: trixie
  UV_SYSTEM_PYTHON: "true"
  UV_PYTHON_DOWNLOADS: "never"
  UV_PROJECT_ENVIRONMENT: "/usr/local"
  UV_CACHE_DIR: ".uv-cache"
  DEBUG: "true"

include:
  - template: SAST.gitlab-ci.yml
  - template: Dependency-Scanning.gitlab-ci.yml
  - template: Secret-Detection.gitlab-ci.yml

workflow:
  rules:
    # Run pipelines on pushes to default branch.
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    # Run pipelines for merge request events.
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    # Do not run pipelines for branch pushes if an MR exists.
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    # Run pipelines for branches without MR (yet).
    - if: $CI_COMMIT_BRANCH
    # Run pipelines for pushed tags, web UI, and schedules.
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == 'web'
    - if: $CI_PIPELINE_SOURCE == 'schedule'

# Minimum supported: Python 3.12, PostgreSQL 14, Redis
test-min:
  image: ghcr.io/astral-sh/uv:$UV_VERSION-python3.12-$BASE_LAYER
  variables:
    SECRET_KEY: testing
    DATABASE_URL: "postgres://postgres:postgres@postgres:5432/postgres"
    ENABLE_TEST_API: "true"
    ENABLE_OPEN_USER_REGISTRATION: "true"
    VALKEY_URL: "redis://redis:6379"
  services:
    - postgres:14
    - name: redis:7
      alias: redis
  cache:
    - key:
        files:
          - uv.lock
      paths:
        - $UV_CACHE_DIR
  script:
    - uv sync --frozen --no-install-project
    - uv run ./manage.py test
    - uv cache prune --ci
  rules:
    - if: $CI_PIPELINE_SOURCE != "schedule"

# Latest stack: Python 3.14, PostgreSQL 18, Valkey, S3 cold storage
test-latest:
  image: ghcr.io/astral-sh/uv:$UV_VERSION-python3.14-$BASE_LAYER
  variables:
    SECRET_KEY: testing
    DATABASE_URL: "postgres://postgres:postgres@postgres:5432/postgres"
    ENABLE_TEST_API: "true"
    ENABLE_OPEN_USER_REGISTRATION: "true"
    VALKEY_URL: "redis://redis:6379"
    GLITCHTIP_ENABLE_DUCKDB: "true"
    GLITCHTIP_COLD_STORAGE_BUCKET: glitchtip-cold
    AWS_ACCESS_KEY_ID: minioadmin
    AWS_SECRET_ACCESS_KEY: minioadmin
    AWS_S3_ENDPOINT_URL: "http://minio:9000"
  services:
    - name: postgres:18
      alias: postgres
    - name: valkey/valkey:9
      alias: redis
    - name: minio/minio:latest
      alias: minio
      command: ["server", "/data"]
      variables:
        MINIO_ROOT_USER: minioadmin
        MINIO_ROOT_PASSWORD: minioadmin
  cache:
    - key:
        files:
          - uv.lock
      paths:
        - $UV_CACHE_DIR
  script:
    # Create MinIO bucket for cold storage tests
    - apt-get update && apt-get install -y curl
    - curl -sSL https://dl.min.io/client/mc/release/linux-amd64/mc -o /usr/local/bin/mc
    - chmod +x /usr/local/bin/mc
    - mc alias set myminio http://minio:9000 minioadmin minioadmin
    - mc mb --ignore-existing myminio/glitchtip-cold || true
    - uv sync --frozen --no-install-project
    # Pre-install DuckDB extensions (mirrors Dockerfile build step)
    - python -c "import duckdb; c=duckdb.connect(); c.install_extension('httpfs'); c.install_extension('aws'); c.close()"
    - uv run ./manage.py test
    - uv cache prune --ci
  rules:
    - if: $CI_PIPELINE_SOURCE != "schedule"

e2e:
  image: docker:29
  services:
    - docker:29-dind
  variables:
    GLITCHTIP_URL: "http://docker:8000"
  script:
    - apk add --no-cache python3 py3-pip bash curl
    - python3 -m venv .venv
    - source .venv/bin/activate
    - pip install requests
    - echo "Running e2e with COMPOSE_FILES=${COMPOSE_FILES}"
    - docker compose ${COMPOSE_FILES} build
    - docker compose ${COMPOSE_FILES} up -d --wait
    - python3 integration_tests/test_e2e.py
  after_script:
    - docker compose ${COMPOSE_FILES} logs
    - docker compose ${COMPOSE_FILES} down -v
  rules:
    - if: $CI_PIPELINE_SOURCE != "schedule"
  parallel:
    matrix:
      # All-in-one with valkey (default production-like setup)
      - COMPOSE_FILES: "-f compose.e2e.yml"
      # All-in-one without valkey (postgres for cache/tasks)
      - COMPOSE_FILES: "-f compose.e2e.yml -f compose.e2e.no-valkey.yml"
      # Separate web + worker with valkey
      - COMPOSE_FILES: "-f compose.e2e.yml -f compose.e2e.web-worker.yml"

lint:
  image: python:3.13-slim
  script:
    - pip install ruff vulture
    - ruff check glitchtip/ apps/
    - vulture apps/ glitchtip/ vulture_whitelist.py --min-confidence 100 --exclude "*/migrations/*,glitchtip/test_runner.py,apps/organizations_ext/api.py"
  rules:
    - if: $CI_PIPELINE_SOURCE != "schedule"

build:
  image: docker:29
  rules:
    # Exclude merge requests and scheduled execution.
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" || $CI_PIPELINE_SOURCE == "schedule"
      when: never
    # Run build only on protected branches and tags (master or v0.0.0).
    - if: $CI_COMMIT_REF_PROTECTED
  services:
    - docker:29-dind
  script:
    - docker login -u gitlab-ci-token -p $CI_JOB_TOKEN registry.gitlab.com
    - docker build -t ${CI_REGISTRY_IMAGE}:${CI_COMMIT_REF_NAME//\//-} --build-arg IS_CI="True" .
    - docker push ${CI_REGISTRY_IMAGE}:${CI_COMMIT_REF_NAME//\//-}

build_arm_x86:
  image: docker:29
  services:
    - docker:29-dind
  before_script:
    - docker run --rm --privileged multiarch/qemu-user-static --reset -p yes
  script:
    - wget https://gitlab.com/api/v4/projects/15449363/jobs/artifacts/$CI_COMMIT_TAG/download?job=build-assets -O assets.zip
    - unzip assets.zip
    - rm assets.zip
    - mv dist/glitchtip-frontend/browser/* dist/
    - rmdir dist/glitchtip-frontend/browser/

    # Version parsing (e.g., v5.0.1 -> 5.0.1, 5.0, 5)
    - VERSION_FULL=${CI_COMMIT_REF_NAME#*v}
    - VERSION_MINOR=${VERSION_FULL%.*}
    - VERSION_MAJOR=${VERSION_FULL%%.*}

    - 'echo "Building tags: latest, ${VERSION_FULL}, ${VERSION_MINOR}, ${VERSION_MAJOR}"'

    - docker login -u ${DOCKER_CI_REGISTRY_USER} -p ${DOCKER_CI_REGISTRY_PASSWORD}
    - docker login -u ${GITLAB_DEPLOY_USER} -p ${GITLAB_DEPLOY_TOKEN} registry.gitlab.com
    - docker login -u ${QUAY_USER} -p ${QUAY_TOKEN} quay.io
    - docker buildx create --use
    - >-
      docker buildx build --platform linux/arm64/v8,linux/amd64 --push
      -t ${DOCKER_CI_REGISTRY_IMAGE}:latest
      -t ${DOCKER_CI_REGISTRY_IMAGE}:${VERSION_FULL}
      -t ${DOCKER_CI_REGISTRY_IMAGE}:${VERSION_MINOR}
      -t ${DOCKER_CI_REGISTRY_IMAGE}:${VERSION_MAJOR}
      -t registry.gitlab.com/glitchtip/glitchtip:latest
      -t registry.gitlab.com/glitchtip/glitchtip:${VERSION_FULL}
      -t registry.gitlab.com/glitchtip/glitchtip:${VERSION_MINOR}
      -t registry.gitlab.com/glitchtip/glitchtip:${VERSION_MAJOR}
      -t quay.io/glitchtip/glitchtip:latest
      -t quay.io/glitchtip/glitchtip:${VERSION_FULL}
      -t quay.io/glitchtip/glitchtip:${VERSION_MINOR}
      -t quay.io/glitchtip/glitchtip:${VERSION_MAJOR}
      --build-arg IS_CI="True"
      --build-arg GLITCHTIP_VERSION=${VERSION_FULL}
      --build-arg COLLECT_STATIC="True" .
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: '$CI_COMMIT_TAG =~ /^v\d+.\d+.\d+/ && $CI_COMMIT_REF_PROTECTED == "true"'

update_deps:
  image: renovate/renovate:43
  variables:
    RENOVATE_PLATFORM: gitlab
    RENOVATE_ENDPOINT: https://gitlab.com/api/v4
    RENOVATE_TOKEN: $GITLAB_ACCESS_TOKEN
    RENOVATE_REPOSITORIES: glitchtip/glitchtip-backend
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  script: renovate