<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Authorize Application</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 480px; margin: 60px auto; padding: 0 20px; color: #333; }
    h1 { font-size: 1.4em; }
    .scopes { margin: 1em 0; padding: 0; list-style: none; }
    .scopes li { padding: 4px 0; font-family: monospace; }
    button { background: #4a54e1; color: #fff; border: none; padding: 10px 24px; border-radius: 4px; font-size: 1em; cursor: pointer; }
    button:hover { background: #3b44c4; }
  </style>
</head>
<body>
  <h1>Authorize {{ client_id }}</h1>
  <p>This application is requesting access to your GlitchTip account with the following permissions:</p>
  {% if scopes %}
  <ul class="scopes">
    {% for scope in scopes %}
    <li>{{ scope }}</li>
    {% endfor %}
  </ul>
  {% else %}
  <p><em>Default permissions</em></p>
  {% endif %}
  <form method="post" action="?data={{ signed_data }}">
    {% csrf_token %}
    <button type="submit">Authorize</button>
  </form>
</body>
</html>
